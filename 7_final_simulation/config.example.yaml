# Config for 7_final_simulation: replay the trained per-layer predictors under a
# mixed chunked-prefill load.
#
# Copy this to config.yaml (gitignored) and edit; re-run with:
#     modal run 7_final_simulation/main.py
#
# Every field below is optional -- omitted fields fall back to the values shown
# here (see CONFIG_DEFAULTS in helper.py).

seed: 0

training:
  dir: /training # volume holding 6_train_all runs
  run_id: null # null = newest run with a summary.json
  layers: null # null = every layer with a checkpoint, or e.g. [20, 21, 22]

cache:
  dir: /cache # volume holding the re-laid-out per-layer cache

harvest:
  dir: /harvest # volume holding the raw harvest (for is_decode labels)

data:
  split: [train, test] # both splits are replayed in full
  datasets: null # reserved; null = every dataset present

simulation:
  # Token budget per chunk (decode + prefill tokens combined).
  chunk_sizes: [64, 128, 256, 512]
  # Fraction of each chunk's budget spent on concurrent decode tokens; the rest
  # is the next prefill tokens of a request. Three load regimes.
  decode_portions: [0.75, 0.5, 0.125]
  # Experts fetched per layer per chunk, as the top-N non-resident experts of the
  # merged per-chunk prediction frequency. 0 is the static no-fetch baseline.
  fetch_counts: [0, 8, 10, 20, 40]
  # Static hot-set sizes, as ratios of the 256 experts (matches 4_analysis).
  ready_ratios: [0.25, 0.5, 0.75]
  # Resident-set policies to sweep. "static" = the fixed hot set, optionally
  # topped up by the per-chunk speculative fetch below; "cached" = the adaptive
  # LFU-displacement cache (mirrors 4_analysis), seeded from the hot set and
  # updated from each chunk's ground-truth demand. The cached policy is an
  # oracle (it observes the true routed experts), so it upper-bounds any
  # prediction-driven loader.
  policies: [static, cached]
  # Per-token top-k of (score + bias) used to build the frequency table.
  prediction_k: 6
  apply_bias: true # select with the reference gate's per-layer bias
  # Rebuild the cached predictions even when a valid cache exists. The cache
  # covers the GPU stage only; re-tuning the knobs below re-runs CPU alone.
  force_predict: false
  # Fetch count whose CDF is drawn in the primary figure (snapped to the nearest
  # configured fetch_counts value).
  primary_fetch: 20
  forward_chunk: 16384 # predictor forward-pass chunk size
  # Decode dispersal: repeated visits to a session land far apart in the
  # document (balanced rotation + van der Corput positions).
  decode_dispersal: van_der_corput
  # Prefill order: each chunk's prefill is consecutive tokens of one request.
  prefill_order: sequential_per_session

output:
  volume_dir: /simulation # Modal volume mount for artifacts
